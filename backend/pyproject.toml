[tool.poetry]
name = "warehouse-storage-backend"
version = "1.0.0"
description = "Warehouse Storage inventory tracking API (FastAPI + SQLAlchemy + SQLite)"
authors = ["Warehouse Storage"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = "^2.0.35"
python-barcode = "^0.15.1"
pillow = "^10.4.0"
pydantic = "^2.9.2"
python-multipart = "^0.0.12"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
