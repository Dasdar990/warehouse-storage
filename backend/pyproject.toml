[project]
name = "warehouse-storage-backend"
version = "1.0.0"
description = "Warehouse Storage inventory tracking API (FastAPI + SQLAlchemy + SQLite)"
authors = [{ name = "Warehouse Storage" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.35",
    "python-barcode>=0.15.1",
    "pillow>=10.4.0",
    "pydantic>=2.9.2",
    "python-multipart>=0.0.12",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
