services:
  backend:
    build:
      context: ./backend
    container_name: warehouse-storage-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
      LABELS_DIR: /app/labels
      # Restrict this to the frontend's real origin in production, e.g.
      # CORS_ALLOW_ORIGINS: "http://your-warehouse-host:3000"
      CORS_ALLOW_ORIGINS: "*"
      # Warehouse map grid: shelf numbers 1..N x these level letters.
      # The grid auto-expands if real data falls outside these bounds.
      WAREHOUSE_SHELF_COUNT: "20"
      WAREHOUSE_LEVELS: "A,B,C,D"
      LOW_STOCK_THRESHOLD: "3"
    volumes:
      - warehouse_db:/app/data
      - warehouse_labels:/app/labels
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in as the build-time default; also passed at runtime below
        # so the Nitro server and browser agree on where the API lives.
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000}
    container_name: warehouse-storage-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # Persists the SQLite database file across container rebuilds/restarts.
  warehouse_db:
  # Persists generated printable barcode label PNGs.
  warehouse_labels:
