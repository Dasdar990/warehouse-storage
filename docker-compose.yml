services:
  backend:
    build:
      context: ./backend
    container_name: warehouse-storage-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
      LABELS_DIR: /app/labels
      CORS_ALLOW_ORIGINS: "*"
    volumes:
      - warehouse_db:/app/data
      - warehouse_labels:/app/labels
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nginxNetwork 

  frontend:
      build:
        context: ./frontend
      container_name: warehouse-storage-frontend
      restart: unless-stopped
      user: "root"
      ports:
        - "3000:3000"
      command: npm run dev
      environment:
        environment:
        NUXT_PUBLIC_API_BASE: "https://dasdar.ddns.net/warehouse-storage-api"
        HOST: 0.0.0.0
        PORT: 3000
        WATCHPACK_POLLING: "true"
      volumes:
        - ./frontend:/app 
        - /app/node_modules 
      depends_on:
        backend:
          condition: service_healthy
      networks:
        - nginxNetwork 

volumes:
  warehouse_db:
  warehouse_labels:

networks:
  nginxNetwork:
    external: true
